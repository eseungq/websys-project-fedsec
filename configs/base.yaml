# 공통 기준 설정 (임시). 팀이 비교 실험으로 확정하면 docs/decisions/에 근거를 남기고 바꿉니다.
seed: 0
split: configs/splits/iid_seed0.json
data_root: data
rounds: 40                   # 학습률 비교 결과 (docs/decisions/001-baseline-setup.md)

model: simple_cnn            # BatchNorm 없는 작은 CNN

train:
  optimizer: sgd
  lr: 0.01
  momentum: 0.9              # 라운드마다 새 옵티마이저 → momentum은 로컬 학습 안에서만 누적
  weight_decay: 0.0
  local_ep: 1
  local_bs: 32

eval_bs: 1000
