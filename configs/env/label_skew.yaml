# 레이블 편향 환경: 기준에서 같은 이미지의 클라이언트 배정만 변경 (나머지는 baseline.yaml과 같음)
# 분할: iid_seed0.json과 같은 검증 세트·이미지 풀·클라이언트별 4,500장, Dirichlet(alpha=0.5)
# 만들기: python scripts/make_split.py --kind label_skew --alpha 0.5 --seed 0
name: label_skew
split: configs/splits/label_skew_a0.5_seed0.json
per_round: null

malicious:
  count: 2
  ids: null
delayed:
  count: 0
  ids: null
  avoid_malicious: true     # 지연 ID를 악성이 아닌 클라이언트 중에서 뽑음 (겹치면 지연·공격 효과가 섞임)

virtual_time:
  base_time: 1.0
  base_samples: 4500
  delay: 2.0
  deadline: 1.5

min_accepted: 3
